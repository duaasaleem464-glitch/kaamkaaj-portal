<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaamkaaj Portal - 3D Visual Edition</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==================== VISUAL 3D GLASS & BACKGROUND THEME ==================== */
    :root {
      --primary: #00d27a;
      --primary-dark: #009958;
      --accent: #ffb703;
      --dark-glass: rgba(15, 23, 42, 0.75);
      --light-glass: rgba(255, 255, 255, 0.88);
      --card-border: 1px solid rgba(255, 255, 255, 0.25);
      --shadow-3d: 0 20px 30px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.2);
      --shadow-glow: 0 0 25px rgba(0, 210, 122, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* BACKGROUND WITH PICTURE OVERLAY */
    body {
      background: linear-gradient(rgba(10, 25, 47, 0.82), rgba(15, 23, 42, 0.92)), 
                  url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glass Navbar */
    .navbar {
      background: var(--dark-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
    }

    .brand i {
      color: var(--primary);
      text-shadow: var(--shadow-glow);
    }

    .brand-badge {
      background: var(--primary);
      color: #022c1e;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 800;
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 15px;
    }

    .nav-item a {
      text-decoration: none;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
    }

    .nav-item a:hover, .nav-item.active a {
      background: rgba(0, 210, 122, 0.15);
      color: var(--primary);
      border-color: rgba(0, 210, 122, 0.4);
      transform: translateY(-3px);
      box-shadow: var(--shadow-glow);
    }

    .saved-badge {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 50%;
    }

    /* Page Routing */
    .page-view {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      padding: 40px 5%;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    .page-view.active-page {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* 3D Hero Banner */
    .hero-card {
      background: linear-gradient(135deg, rgba(0, 210, 122, 0.25) 0%, rgba(15, 23, 42, 0.75) 100%);
      backdrop-filter: blur(20px);
      border: var(--card-border);
      border-radius: 28px;
      padding: 50px 40px;
      box-shadow: var(--shadow-3d);
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }

    .hero-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 15px;
      background: linear-gradient(to right, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 18px;
      color: #94a3b8;
      max-width: 600px;
    }

    /* 3D Search Bar */
    .search-box-3d {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 15px;
      border-radius: 20px;
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 130px;
      gap: 12px;
      border: var(--card-border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      margin-top: 30px;
    }

    .search-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .search-input-group input, .search-input-group select {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-weight: 600;
      color: white;
    }

    .search-input-group select option {
      background: #0f172a;
      color: white;
    }

    .btn-search {
      background: var(--primary);
      color: #022c1e;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-glow);
    }

    .btn-search:hover {
      background: #00ff94;
      transform: translateY(-3px) scale(1.03);
    }

    /* 3D Job Cards Grid */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
    }

    .job-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 28px;
      border: var(--card-border);
      box-shadow: var(--shadow-3d);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transform-style: preserve-3d;
    }

    .job-card:hover {
      transform: translateY(-12px) rotateX(4deg) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), var(--shadow-glow);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .company-logo-3d {
      width: 55px;
      height: 55px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, #005c3b 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 8px 15px rgba(0, 210, 122, 0.3);
    }

    .save-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      color: #94a3b8;
      font-size: 16px;
    }

    .save-btn.saved {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
    }

    .job-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .company-name {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tag-city { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .tag-salary { background: rgba(0, 210, 122, 0.15); color: var(--primary); }

    .job-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 18px;
    }

    .btn-apply {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .btn-apply:hover {
      background: var(--primary);
      color: #022c1e;
      border-color: var(--primary);
      box-shadow: var(--shadow-glow);
    }

    /* Dynamic Pop-Up Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-3d {
      background: #0f172a;
      border: var(--card-border);
      border-radius: 28px;
      width: 90%;
      max-width: 520px;
      padding: 35px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), var(--shadow-glow);
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popUp {
      0% { transform: scale(0.6) translateY(50px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @media (max-width: 900px) {
      .search-box-3d { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Glass Navbar -->
  <nav class="navbar">
    <div class="brand" onclick="switchPage('home')">
      <i class="fa-solid fa-cube"></i> Kaamkaaj <span class="brand-badge">3D PK</span>
    </div>

    <ul class="nav-menu">
      <li class="nav-item active" id="nav-home"><a onclick="switchPage('home')"><i class="fa-solid fa-house"></i> Home</a></li>
      <li class="nav-item" id="nav-saved">
        <a onclick="switchPage('saved')">
          <i class="fa-solid fa-bookmark"></i> Saved <span class="saved-badge" id="savedBadge">0</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- HOME PAGE VIEW -->
  <main id="page-home" class="page-view active-page">
    <div class="hero-card">
      <h1 class="hero-title">Pakistan's Premium 3D Job Portal 🇵🇰</h1>
      <p class="hero-subtitle">Explore verified local & remote vacancies across Karachi, Lahore, Islamabad with real-time 3D experience.</p>
      
      <!-- 3D Glass Search Bar -->
      <div class="search-box-3d">
        <div class="search-input-group">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--primary);"></i>
          <input type="text" id="searchInput" placeholder="Search job title, skills..." onkeyup="filterJobs()">
        </div>
        
        <div class="search-input-group">
          <i class="fa-solid fa-location-dot" style="color: var(--primary);"></i>
          <select id="citySelect" onchange="filterJobs()">
            <option value="">All Cities</option>
            <option value="Karachi">Karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Remote">Remote</option>
          </select>
        </div>

        <div class="search-input-group">
          <i class="fa-solid fa-filter" style="color: var(--primary);"></i>
          <select id="typeSelect" onchange="filterJobs()">
            <option value="">All Types</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Part-Time">Part-Time</option>
            <option value="Freelance">Freelance</option>
          </select>
        </div>

        <button class="btn-search" onclick="filterJobs()">Search</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
      <h2 style="font-size:24px; font-weight:800;"><i class="fa-solid fa-bolt" style="color: var(--accent);"></i> Top Verified Vacancies</h2>
      <span style="font-weight:700; color:var(--primary);" id="jobCountText">Showing Jobs</span>
    </div>

    <!-- 3D Cards Container -->
    <div class="jobs-grid" id="jobsGridContainer"></div>
  </main>

  <!-- SAVED PAGE VIEW -->
  <main id="page-saved" class="page-view">
    <h2 style="font-size:26px; font-weight:800; margin-bottom:25px;"><i class="fa-solid fa-bookmark" style="color: #ef4444;"></i> Saved Bookmarks</h2>
    <div class="jobs-grid" id="savedJobsContainer"></div>
  </main>

  <!-- 3D POP-UP MODAL -->
  <div class="modal-overlay" id="applyModal">
    <div class="modal-3d">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 id="modalJobTitle" style="font-size:20px; font-weight:800; color:var(--primary);">Apply For Position</h3>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:22px; color:#94a3b8;" onclick="closeApplyModal()"></i>
      </div>
      <form onsubmit="handleApplySubmit(event)">
        <div style="margin-bottom:15px;">
          <label style="font-size:12px; font-weight:700; color:#cbd5e1; display:block; margin-bottom:6px;">Full Name</label>
          <input type="text" required placeholder="Enter your full name" style="width:100%; padding:12px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:white;">
        </div>
        <div style="margin-bottom:15px;">
          <label style="font-size:12px; font-weight:700; color:#cbd5e1; display:block; margin-bottom:6px;">Phone / WhatsApp</label>
          <input type="tel" required placeholder="0300-1234567" style="width:100%; padding:12px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:white;">
        </div>
        <div style="margin-bottom:20px;">
          <label style="font-size:12px; font-weight:700; color:#cbd5e1; display:block; margin-bottom:6px;">Upload CV (PDF)</label>
          <input type="file" required accept=".pdf" style="width:100%; padding:10px; border-radius:12px; background:rgba(0,210,122,0.1); border:1px dashed var(--primary); color:white;">
        </div>
        <button type="submit" class="btn-search" style="width:100%; padding:14px;">Submit Application 🚀</button>
      </form>
    </div>
  </div>

  <script>
    const jobsData = [
      { id: 1, title: "Senior React 3D Developer", company: "Systems Limited", city: "Lahore", type: "Full-Time", salary: "PKR 200k - 280k", posted: "1 hour ago", logoText: "SL" },
      { id: 2, title: "UI/UX Visual Designer", company: "10Pearls PK", city: "Remote", type: "Freelance", salary: "PKR 140k - 180k", posted: "3 hours ago", logoText: "10P" },
      { id: 3, title: "Full Stack Laravel Engineer", company: "Contour Software", city: "Karachi", type: "Full-Time", salary: "PKR 160k - 230k", posted: "5 hours ago", logoText: "CS" },
      { id: 4, title: "Mobile Flutter Specialist", company: "TPS Pakistan", city: "Islamabad", type: "Full-Time", salary: "PKR 150k - 210k", posted: "1 day ago", logoText: "TPS" },
      { id: 5, title: "SEO Content Lead", company: "TRG Pakistan", city: "Lahore", type: "Part-Time", salary: "PKR 65k - 90k", posted: "2 days ago", logoText: "TRG" }
    ];

    let savedJobIds = [];

    function switchPage(pageName) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active-page'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

      const targetPage = document.getElementById('page-' + pageName);
      if (targetPage) targetPage.classList.add('active-page');

      const targetNav = document.getElementById('nav-' + pageName);
      if (targetNav) targetNav.classList.add('active');

      if (pageName === 'saved') renderSavedJobs();
    }

    function renderJobs(list) {
      const container = document.getElementById('jobsGridContainer');
      document.getElementById('jobCountText').innerText = `Showing ${list.length} Jobs`;

      container.innerHTML = list.map(job => {
        const isSaved = savedJobIds.includes(job.id);
        return `
          <div class="job-card">
            <div>
              <div class="job-header">
                <div class="company-logo-3d">${job.logoText}</div>
                <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSaveJob(${job.id})">
                  <i class="fa-solid fa-bookmark"></i>
                </button>
              </div>
              <h3 class="job-title">${job.title}</h3>
              <p class="company-name">${job.company}</p>
              <div class="job-tags">
                <span class="tag tag-city"><i class="fa-solid fa-location-dot"></i> ${job.city}</span>
                <span class="tag"><i class="fa-solid fa-clock"></i> ${job.type}</span>
                <span class="tag tag-salary"><i class="fa-solid fa-money-bill"></i> ${job.salary}</span>
              </div>
            </div>
            <div class="job-footer">
              <span style="font-size:12px; color:#94a3b8;">${job.posted}</span>
              <button class="btn-apply" onclick="openApplyModal('${job.title}')">Apply Now</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterJobs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const city = document.getElementById('citySelect').value;
      const type = document.getElementById('typeSelect').value;

      const filtered = jobsData.filter(job => {
        return (job.title.toLowerCase().includes(query) || job.company.toLowerCase().includes(query)) &&
               (city === "" || job.city === city) &&
               (type === "" || job.type === type);
      });
      renderJobs(filtered);
    }

    function toggleSaveJob(id) {
      if (savedJobIds.includes(id)) {
        savedJobIds = savedJobIds.filter(item => item !== id);
      } else {
        savedJobIds.push(id);
      }
      document.getElementById('savedBadge').innerText = savedJobIds.length;
      filterJobs();
      if (document.getElementById('page-saved').classList.contains('active-page')) renderSavedJobs();
    }

    function renderSavedJobs() {
      const container = document.getElementById('savedJobsContainer');
      const savedList = jobsData.filter(job => savedJobIds.includes(job.id));

      if (savedList.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:50px;">No saved bookmarks yet.</p>`;
        return;
      }

      container.innerHTML = savedList.map(job => `
        <div class="job-card">
          <div>
            <h3 class="job-title">${job.title}</h3>
            <p class="company-name">${job.company}</p>
          </div>
          <button class="btn-apply" onclick="openApplyModal('${job.title}')">Apply Now</button>
        </div>
      `).join('');
    }

    function openApplyModal(title) {
      document.getElementById('modalJobTitle').innerText = "Apply for: " + title;
      document.getElementById('applyModal').classList.add('active');
    }

    function closeApplyModal() {
      document.getElementById('applyModal').classList.remove('active');
    }

    function handleApplySubmit(e) {
      e.preventDefault();
      alert("Application Submitted Successfully! 🎉");
      closeApplyModal();
    }

    renderJobs(jobsData);
  </script>
</body>
</html>
